name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate synthetic data
        run: python data/generate_synthetic_data.py --n 5000 --out data/credit_data.csv

      - name: Train model (smoke test)
        run: python src/train.py --data data/credit_data.csv

      - name: Run tests
        run: pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate synthetic data
        run: python data/generate_synthetic_data.py --n 5000 --out data/credit_data.csv

      - name: Train model
        run: python src/train.py --data data/credit_data.csv

      - name: Build Docker image
        run: docker build -t credit-risk-api .